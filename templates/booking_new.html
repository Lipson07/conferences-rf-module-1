{% extends "base.html" %}
{% block title %}Новая заявка — Конференции.РФ{% endblock %}
{% block content %}
<section class="form-box">
    <h1 class="form-box__title">Новая заявка</h1>
    <form class="form" method="post" novalidate>

        <div class="form__group">
            <label class="form-label" for="participants">Количество участников</label>
            <input class="form-control {{ 'is-invalid' if errors.participants }}" id="participants" name="participants"
                   type="number" min="1" max="500" value="{{ form.participants or '10' }}">
            <small class="form__hint">Целое число от 1 до 500</small>
            <div class="form__error">{{ errors.participants or '' }}</div>
        </div>
        <fieldset class="form__group">
            <legend class="form-label form__legend">Способ оплаты</legend>
            {% for method in payment_methods %}
            <div class="form-check">
                <input class="form-check-input" type="radio" id="pay{{ loop.index }}" name="payment_method"
                       value="{{ method }}" {{ 'checked' if form.payment_method == method }}>
                <label class="form-check-label" for="pay{{ loop.index }}">{{ method }}</label>
            </div>
            {% endfor %}
            <div class="form__error">{{ errors.payment_method or '' }}</div>
        </fieldset>
        <button class="btn btn-primary button w-100" type="submit">Отправить</button>
    </form>
</section>
{% endblock %}
